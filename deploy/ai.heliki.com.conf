server {
    listen 80;
    server_name ai.heliki.com;
    location ^~ /.well-known/acme-challenge/ {
        root /home/wwwroot/ai404-acme;
    }
    location / {
        return 301 https://ai.heliki.com$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name ai.heliki.com;
    ssl_certificate /etc/letsencrypt/live/ai.heliki.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ai.heliki.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:AI404SSL:1m;
    ssl_session_timeout 10m;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    access_log off;
    error_log /home/wwwlogs/ai.heliki.com.error.log;
    client_max_body_size 64k;

    location / {
        proxy_pass http://127.0.0.1:8817;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 10s;
        proxy_read_timeout 1200s;
        proxy_buffering off;
        proxy_send_timeout 60s;
    }
}
