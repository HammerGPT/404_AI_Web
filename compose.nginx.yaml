name: ai404
services:
  app:
    image: ai404-web:local
    build: .
    restart: unless-stopped
    shm_size: 256m
    ports:
      - "127.0.0.1:8817:8000"
    environment:
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      COOKIE_SECURE: "1"
      DB_PATH: /data/tester.db
      ALLOWED_API_HOSTS: ${ALLOWED_API_HOSTS:-}
      FORWARDED_ALLOW_IPS: ${TRUSTED_PROXY_IP:?Set the Docker network gateway in .env}
    volumes:
      - reports:/data
    networks: [proxy]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=5).close()"]
      interval: 30s
      timeout: 6s
      start_period: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
networks:
  proxy:
    external: true
    name: ai404-proxy
volumes:
  reports:
    name: ai404-reports
