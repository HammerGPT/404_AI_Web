name: Import initial 404 AI source
on:
  push:
    paths:
      - ".import/source.tar.xz.b64"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Unpack verified project snapshot
        shell: bash
        run: |
          set -euo pipefail
          test -s .import/source.tar.xz.b64
          base64 -d .import/source.tar.xz.b64 > /tmp/404-ai-source.tar.xz
          mkdir -p /tmp/404-ai-unpacked
          tar -xJf /tmp/404-ai-source.tar.xz -C /tmp/404-ai-unpacked
          find /tmp/404-ai-unpacked -type l -print -quit | grep -q . && { echo "Unexpected symlink"; exit 1; } || true
          cp -a /tmp/404-ai-unpacked/. ./
          rm -rf .import
          git config user.name "404 AI Source Import"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "feat: import 404 AI V1.1 web application, docs and tests"
            git push
          fi
